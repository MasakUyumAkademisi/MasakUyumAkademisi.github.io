<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MASAK Hazırlık - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7f6;
        color: #18231f;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(92vw, 34rem);
        border: 1px solid #dfe7e3;
        border-radius: 0.5rem;
        background: #fff;
        padding: 1.25rem;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: 1.45rem;
      }
      p {
        margin: 0;
        color: #66756f;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı yok</h1>
      <p>MASAK Hazırlık ana ekranı çevrimdışı kullanım için önbelleğe alınır. Sayfayı daha önce açtıysanız tekrar deneyin.</p>
    </main>
  </body>
</html>
